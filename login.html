<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оснастка PRO — Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--ink:#0a0c10;--steel:#141824;--panel:#0f1319;--border:#232b3e;--accent:#e8a020;--text:#c8d0e0;--muted:#4a5470;--danger:#e03030;--ok:#20c060}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Rajdhani',sans-serif;background:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
        body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(59,125,216,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,125,216,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
        body::after{content:'';position:fixed;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(232,160,32,.06) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;animation:glow 4s ease-in-out infinite}
        @keyframes glow{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}50%{opacity:.5;transform:translate(-50%,-50%) scale(1.15)}}
        .scanline{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.015) 2px,rgba(0,0,0,.015) 4px);pointer-events:none;z-index:9999}
        .wrap{width:100%;max-width:420px;padding:20px;position:relative;z-index:1}
        .card{background:var(--panel);border:1px solid var(--border);padding:44px 40px;position:relative;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
        .corner{position:absolute;width:22px;height:22px}
        .tl{top:0;left:0;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
        .tr{top:0;right:0;border-top:2px solid var(--accent);border-right:2px solid var(--accent)}
        .bl{bottom:0;left:0;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent)}
        .br{bottom:0;right:0;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}
        .brand{display:flex;align-items:center;gap:16px;margin-bottom:36px}
        .brand-hex{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),#c07010);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
        .brand h1{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--accent);letter-spacing:3px;line-height:1}
        .brand p{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
        .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
        .lbl span{color:var(--accent)}
        .field{margin-bottom:20px}
        input[type=text],input[type=password]{width:100%;padding:13px 46px 13px 16px;background:#1a1f2e;border:1px solid var(--border);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:500;outline:none;transition:.2s;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
        input::placeholder{color:var(--muted)}
        input:focus{border-color:var(--accent);background:#1e2535;box-shadow:0 0 0 1px var(--accent),inset 0 0 20px rgba(232,160,32,.03)}
        .pw-wrap{position:relative}
        .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;transition:color .2s}
        .eye:hover{color:var(--accent)}
        .err{display:none;background:rgba(224,48,48,.1);border:1px solid rgba(224,48,48,.3);color:#ff7070;padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:20px;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
        .err.on{display:block;animation:shake .3s}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
        .btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),#c07010);border:none;color:#000;font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:4px;cursor:pointer;position:relative;overflow:hidden;transition:.2s;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));margin-top:8px}
        .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:translateX(-100%);transition:.4s}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,160,32,.3)}
        .btn:hover::after{transform:translateX(100%)}
        .btn:active{transform:translateY(0)}
        .btn.busy{pointer-events:none;opacity:.7}
        .footer{margin-top:24px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
        .status{display:flex;align-items:center;gap:6px}
        .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 2s ease-in-out infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    </style>
</head>
<body>
<div class="scanline"></div>
<div class="wrap">
    <div class="card">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="brand">
            <div class="brand-hex">⚙</div>
            <div><h1>Оснастка PRO</h1><p>Система управления оснасткой</p></div>
        </div>
        <div id="err" class="err"></div>
        <div class="field">
            <div class="lbl"><span>//</span> Пользователь</div>
            <input type="text" id="username" placeholder="Введите логин" autocomplete="off" autocapitalize="none">
        </div>
        <div class="field">
            <div class="lbl"><span>//</span> Пароль</div>
            <div class="pw-wrap">
                <input type="password" id="password" placeholder="••••••••">
                <button class="eye" onclick="togglePass(this)" type="button" tabindex="-1">👁</button>
            </div>
        </div>
        <button class="btn" id="loginBtn" onclick="login()">Войти в систему</button>
        <div class="footer">
            <span class="status"><span class="dot"></span>СИСТЕМА ОНЛАЙН</span>
            <span>v2.0.0</span>
        </div>
    </div>
</div>
<script>
function togglePass(btn){const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'👁':'🙈'}
async function login(){
    const u=document.getElementById('username').value.trim(),
          p=document.getElementById('password').value,
          e=document.getElementById('err'),
          b=document.getElementById('loginBtn');
    e.classList.remove('on');
    if(!u||!p){e.textContent='// ОШИБКА: Заполните все поля';e.classList.add('on');return}
    b.textContent='АВТОРИЗАЦИЯ...';b.classList.add('busy');
    try{
        const r=await fetch('auth.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        const d=await r.json();
        if(d.success){b.textContent='✓ ДОСТУП РАЗРЕШЁН';b.style.background='linear-gradient(135deg,#20c060,#108040)';setTimeout(()=>{window.location.href='index.html'},500)}
        else{e.textContent='// ОШИБКА: '+(d.error||'Неверный логин или пароль');e.classList.add('on');b.textContent='Войти в систему';b.classList.remove('busy')}
    }catch{e.textContent='// ОШИБКА: Нет соединения с сервером';e.classList.add('on');b.textContent='Войти в систему';b.classList.remove('busy')}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
</html>
