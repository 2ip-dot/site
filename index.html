<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оснастка PRO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
    min-height: 100vh;
    transition: 0.3s;
}

body.dark {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #f1f5f9;
}

.container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 20px;
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 25px;
    padding: 15px 0;
}

h1 {
    font-size: 28px;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.dark h1 {
    background: linear-gradient(135deg, #a5f3fc, #7dd3fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Controls */
.controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}

input, select {
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 14px;
    background: white;
    transition: 0.2s;
}

.dark input, .dark select {
    background: #334155;
    border-color: #475569;
    color: white;
}

input:focus, select:focus {
    outline: none;
    border-color: #2a5298;
    box-shadow: 0 0 0 3px rgba(42,82,152,0.1);
}

#searchInput {
    width: 250px;
}

button {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: 0.2s;
}

#themeBtn, #favBtn {
    background: #1e293b;
    color: white;
}

#logoutBtn {
    background: #dc2626;
    color: white;
}

#logoutBtn:hover {
    background: #b91c1c;
}

.dark #themeBtn, .dark #favBtn {
    background: #475569;
}

button:hover {
    transform: translateY(-2px);
}

/* Stats */
#stats {
    margin-bottom: 20px;
    padding: 10px;
    font-weight: 500;
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

/* Card */
.card {
    background: white;
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: 0.25s;
    position: relative;
    border: 1px solid rgba(0,0,0,0.05);
}

.dark .card {
    background: #1e293b;
    border-color: #334155;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.favorite {
    position: absolute;
    top: 15px;
    right: 15px;
    cursor: pointer;
    font-size: 20px;
    transition: 0.2s;
}

.favorite:hover {
    transform: scale(1.1);
}

.product {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 8px;
    padding-right: 30px;
    color: #1e293b;
}

.dark .product {
    color: #f1f5f9;
}

.liters {
    display: inline-block;
    background: #eef2ff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 15px;
}

.dark .liters {
    background: #334155;
}

.params {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 15px 0;
}

.param {
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
}

.dark .param {
    border-bottom-color: #334155;
}

.weight {
    background: #fef3c7;
    border-radius: 12px;
    padding: 5px 10px;
    font-weight: 700;
    color: #b45309;
    border-bottom: none;
}

.dark .weight {
    background: #451a03;
    color: #fde68a;
}

.machine {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #e0e0e0;
    font-size: 12px;
    color: #666;
}

.dark .machine {
    border-top-color: #334155;
    color: #94a3b8;
}

/* Responsive */
@media (max-width: 640px) {
    .container {
        padding: 15px;
    }
    #searchInput {
        width: 100%;
    }
    .controls {
        width: 100%;
    }
    input, select, button {
        flex: 1;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏭 Оснастка PRO</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Поиск..." list="suggestions">
            <datalist id="suggestions"></datalist>
            <select id="machineSelect">
                <option value="">📌 Все машины</option>
            </select>
            <select id="volumeSelect">
                <option value="">📏 Все объемы</option>
            </select>
            <button id="favBtn">⭐ Избранное</button>
            <button id="themeBtn">🌙 Тема</button>
            <button id="logoutBtn" style="background:#dc2626;">🚪 Выйти</button>
        </div>
    </div>
    <div id="stats"></div>
    <div class="grid" id="resultsContainer"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
